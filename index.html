<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sport TV - Rozcestník</title>

  <!-- TV Layer Adapters -->
  <script src="../tizen-adapter.js"></script>
  <script src="../tizen-avplay.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Bebas+Neue&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <!-- Shaka Player CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/shaka-player/dist/controls.min.css">
  <script src="https://cdn.jsdelivr.net/npm/shaka-player/dist/shaka-player.ui.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mux.js/7.1.0/mux.min.js"></script>

  <style>
    :root {
      --bg-dark: #08090d;
      --bg-surface: #0f121a;
      --bg-elevated: #161b26;
      --bg-card: #1a2030;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #FFC629;
      --accent-soft: rgba(255, 198, 41, 0.14);
      --accent-glow: rgba(255, 198, 41, 0.35);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-gold: rgba(255, 198, 41, 0.45);
      --radius-sm: 8px;
      --radius-md: 12px;
      --sidebar-w: 360px;
      --header-h: 60px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* ── Header ── */
    .top-header {
      height: var(--header-h);
      background: rgba(10, 12, 18, 0.95);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      flex-shrink: 0;
      z-index: 100;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .btn-back-menu {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-subtle);
      color: #fff;
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      outline: none;
    }
    .btn-back-menu:hover, .btn-back-menu:focus, .btn-back-menu:focus-visible {
      background: var(--accent) !important;
      color: #000 !important;
      border-color: var(--accent) !important;
      box-shadow: 0 0 16px var(--accent-glow) !important;
      transform: scale(1.05);
    }
    .brand-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem;
      letter-spacing: 2px;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      font-weight: 700;
      background: rgba(255, 198, 41, 0.15);
      border: 1px solid var(--border-gold);
      color: var(--accent);
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 1px;
    }
    .header-clock {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    /* ── Main Layout ── */
    .main-body {
      flex: 1;
      display: flex;
      height: calc(100vh - var(--header-h));
      overflow: hidden;
    }

    /* ── Left Sidebar (Channels) ── */
    .channel-sidebar {
      width: var(--sidebar-w);
      background: var(--bg-surface);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      height: 100%;
    }
    .sidebar-head {
      padding: 14px 18px;
      background: rgba(14, 17, 26, 0.9);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sidebar-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .channel-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .channel-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: var(--bg-elevated);
      border: 1.5px solid transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      outline: none;
      position: relative;
    }
    .channel-item:hover {
      background: var(--bg-card);
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateX(4px);
    }
    .channel-item:focus, .channel-item:focus-visible {
      outline: none !important;
      background: #1e2538 !important;
      border-color: var(--accent) !important;
      box-shadow: 0 0 20px var(--accent-glow), 0 0 0 2px var(--accent) !important;
      transform: scale(1.03) translateX(6px) !important;
      z-index: 10;
    }
    .channel-item.active {
      background: var(--accent-soft);
      border-left: 4px solid var(--accent);
    }
    .channel-item.active .chan-name {
      color: var(--accent);
      font-weight: 700;
    }
    .chan-logo {
      width: 48px;
      height: 36px;
      object-fit: contain;
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 4px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .chan-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .chan-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chan-sub {
      font-size: 0.72rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ef4444;
      display: inline-block;
      box-shadow: 0 0 6px #ef4444;
    }

    /* ── Right Content (Player + EPG) ── */
    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    /* Player Area */
    .player-area {
      width: 100%;
      aspect-ratio: 16/9;
      max-height: 62vh;
      background: #000;
      position: relative;
      flex-shrink: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .video-container, .shaka-video-container {
      width: 100% !important;
      height: 100% !important;
      position: relative !important;
      background: #000 !important;
    }
    #video {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain !important;
      background: #000 !important;
      outline: none !important;
    }

    /* EPG Program Card */
    .epg-panel {
      flex: 1;
      background: linear-gradient(180deg, #0e111a 0%, var(--bg-dark) 100%);
      border-top: 1px solid var(--border-subtle);
      padding: 24px 32px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .epg-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .epg-chan-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 198, 41, 0.12);
      border: 1px solid var(--border-gold);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent);
    }
    .epg-status-live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #ef4444;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }
    .prog-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: #fff;
      line-height: 1.25;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }
    .prog-meta-row {
      display: flex;
      align-items: center;
      gap: 16px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    .prog-progress-wrap {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 700px;
    }
    .prog-bar-track {
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
    }
    .prog-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #ffa726);
      width: 0%;
      transition: width 0.4s linear;
      box-shadow: 0 0 10px var(--accent-glow);
    }
    .prog-times {
      display: flex;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .prog-desc {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #cbd5e1;
      max-width: 900px;
      max-height: 120px;
      overflow-y: auto;
    }

    /* Shaka Button TV Focus */
    .shaka-controls-container button:focus,
    .shaka-controls-container button:focus-visible,
    .shaka-overflow-menu button:focus,
    .shaka-settings-menu button:focus {
      outline: none !important;
      background: rgba(255, 198, 41, 0.35) !important;
      color: var(--accent) !important;
      box-shadow: 0 0 16px var(--accent-glow) !important;
      transform: scale(1.15) !important;
    }
    .shaka-big-buttons-container,
    .shaka-play-button-container,
    .shaka-play-button {
      display: none !important;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
  </style>
</head>

<body>
  <!-- Top Header Bar -->
  <header class="top-header">
    <div class="header-left">
      <button id="btn-back-menu" class="btn-back-menu" tabindex="0" title="Zpět do Rozcestníku">
        <i class="fa-solid fa-arrow-left"></i> <span>Rozcestník</span>
      </button>
      <div class="brand-title">
        <i class="fa-solid fa-trophy"></i> <span>Sport TV</span>
      </div>
      <span class="brand-badge">LIVE HQ</span>
    </div>
    <div class="header-clock" id="header-clock">--:--</div>
  </header>

  <!-- Main Body: Sidebar + Player/EPG -->
  <div class="main-body">
    <!-- Channel Sidebar -->
    <aside class="channel-sidebar" id="channel-sidebar">
      <div class="sidebar-head">
        <div class="sidebar-title">
          <i class="fa-solid fa-satellite-dish" style="color:var(--accent);"></i>
          <span>Sportovní kanály (<span id="chan-count">0</span>)</span>
        </div>
      </div>
      <div class="channel-list" id="channel-list" role="list">
        <!-- Rendered dynamically -->
      </div>
    </aside>

    <!-- Player Area & EPG Card -->
    <main class="content-area" id="content-area">
      <div class="player-area" id="player-area">
        <div class="video-container" data-shaka-player-container id="shaka-container">
          <video id="video" data-shaka-player autoplay playsinline webkit-playsinline referrerpolicy="no-referrer"></video>
        </div>
      </div>

      <div class="epg-panel" id="epg-panel">
        <div class="epg-card-header">
          <div class="epg-chan-badge" id="epg-chan-badge">
            <i class="fa-solid fa-tv"></i> <span id="epg-chan-name">Vyberte kanál</span>
          </div>
          <div class="epg-status-live" id="epg-status-live">
            <span class="live-dot"></span> <span>ŽIVĚ</span>
          </div>
        </div>
        <h1 class="prog-title" id="prog-title">Načítání programu...</h1>
        <div class="prog-progress-wrap">
          <div class="prog-bar-track">
            <div class="prog-bar-fill" id="prog-bar-fill"></div>
          </div>
          <div class="prog-times">
            <span id="prog-time-start">--:--</span>
            <span id="prog-time-end">--:--</span>
          </div>
        </div>
        <p class="prog-desc" id="prog-desc">Vyberte sportovní kanál v levém menu pro spuštění přenosu.</p>
      </div>
    </main>
  </div>

  <script>
  (function() {
    'use strict';

    // ── 1. Clearance Token Management ──
    function getClearanceToken() {
      var tok = '';
      try {
        var p = new URLSearchParams(window.location.search);
        tok = p.get('cf_clearance') || p.get('clearance') || p.get('token') || '';
      } catch(e) {}
      if (!tok && window.__cf_clearance_token) tok = window.__cf_clearance_token;
      if (!tok) {
        try {
          if (window.parent && window.parent !== window) {
            tok = window.parent.__cf_clearance_token ||
                  window.parent.sessionStorage.getItem('cf_clearance_token') ||
                  window.parent.localStorage.getItem('cf_clearance_token') || '';
          }
        } catch(e) {}
      }
      if (!tok) {
        try {
          tok = sessionStorage.getItem('cf_clearance_token') || localStorage.getItem('cf_clearance_token') || '';
        } catch(e) {}
      }
      return tok;
    }

    // ── 2. Clock Ticker ──
    function updateClock() {
      var el = document.getElementById('header-clock');
      if (el) {
        var d = new Date();
        var hh = String(d.getHours()).padStart(2, '0');
        var mm = String(d.getMinutes()).padStart(2, '0');
        el.textContent = hh + ':' + mm;
      }
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ── 3. DOM Elements ──
    var btnBack = document.getElementById('btn-back-menu');
    var chanListEl = document.getElementById('channel-list');
    var chanCountEl = document.getElementById('chan-count');
    var videoElem = document.getElementById('video');
    var shakaContainer = document.getElementById('shaka-container');
    var epgChanName = document.getElementById('epg-chan-name');
    var progTitle = document.getElementById('prog-title');
    var progDesc = document.getElementById('prog-desc');
    var progBarFill = document.getElementById('prog-bar-fill');
    var progTimeStart = document.getElementById('prog-time-start');
    var progTimeEnd = document.getElementById('prog-time-end');

    if (btnBack) {
      btnBack.onclick = function() {
        window.location.href = '../index.html';
      };
    }

    // ── 4. Shaka Player Setup ──
    var shakaPlayer = null;
    var shakaControls = null;
    var currentChannel = null;
    var currentLoadId = 0;
    var sportChannels = [];
    var activeCardElem = null;

    async function initShaka() {
      if (shakaPlayer) return shakaPlayer;
      if (!shaka.Player.isBrowserSupported()) {
        console.warn('Shaka not supported');
        return null;
      }
      var ui = videoElem['ui'];
      if (!ui) {
        shakaPlayer = new shaka.Player(videoElem);
        ui = new shaka.ui.Overlay(shakaPlayer, shakaContainer, videoElem);
      }
      ui.configure({
        doubleClickForFullscreen: false,
        fadeDelay: 5,
        bigButtons: [],
        controlPanelElements: [
          'play_pause',
          'time_and_duration',
          'mute',
          'volume',
          'spacer',
          'overflow_menu',
          'fullscreen'
        ],
        overflowMenuButtons: [
          'quality',
          'language',
          'captions'
        ],
        addSeekBar: true
      });
      shakaControls = ui.getControls();
      shakaPlayer = shakaControls.getPlayer();

      shakaPlayer.configure({
        streaming: {
          rebufferingGoal: 2,
          bufferingGoal: 6,
          bufferBehind: 15,
          lowLatencyMode: true,
          jumpLargeGaps: true
        }
      });
      return shakaPlayer;
    }

    async function unloadPlayer() {
      if (typeof TizenAVPlay !== 'undefined') {
        try { TizenAVPlay.stop(); } catch(e) {}
      }
      if (shakaPlayer) {
        try { await shakaPlayer.unload(); } catch(e) {}
      }
      if (videoElem) {
        videoElem.pause();
        videoElem.removeAttribute('src');
        videoElem.load();
      }
    }

    // ── 5. Channel Playback ──
    async function playChannel(ch, cardEl) {
      if (!ch) return;
      currentChannel = ch;
      var loadId = ++currentLoadId;

      if (activeCardElem) activeCardElem.classList.remove('active');
      if (cardEl) {
        cardEl.classList.add('active');
        activeCardElem = cardEl;
      }

      if (epgChanName) epgChanName.textContent = ch.name;
      updateEpgForChannel(ch.name);

      await unloadPlayer();
      if (loadId !== currentLoadId) return;

      var streamUrl = '';
      try {
        var res = await fetch('https://e.yasuoyone.org/api/get-stream?id=' + encodeURIComponent(ch.name));
        if (loadId !== currentLoadId) return;
        var data = await res.json();
        if (!data || !data.stream) throw new Error('No stream');

        var streamRes = await fetch('https://e.yasuoyone.org' + data.stream);
        if (loadId !== currentLoadId) return;
        streamUrl = (await streamRes.text()).trim();

        streamUrl = streamUrl.replace(/([?&])(cf_clearance|clearance)=[^&]*/g, '')
                             .replace(/\?&/, '?').replace(/&&+/, '&').replace(/[?&]$/, '');

        // Samsung TV Native AVPlay (Hardware acceleration)
        if (typeof TizenAVPlay !== 'undefined' && TizenAVPlay.isAvailable()) {
          console.log('[Sport TV] Using TizenAVPlay:', streamUrl);
          shakaContainer.style.display = 'block';
          videoElem.style.display = 'none';
          TizenAVPlay.play(streamUrl, {
            containerEl: shakaContainer,
            onError: function() {
              console.warn('[Sport TV] AVPlay fallback to Shaka');
              videoElem.style.display = '';
              initShaka().then(function(sp) {
                if (sp) sp.load(streamUrl).then(function() { videoElem.play().catch(function(){}); });
              });
            }
          });
          return;
        }

        // Shaka Player MSE Playback
        await initShaka();
        if (loadId !== currentLoadId) return;
        videoElem.style.display = '';
        await shakaPlayer.load(streamUrl);
        await videoElem.play().catch(function() {
          videoElem.muted = true;
          videoElem.play().catch(function(){});
        });
      } catch (err) {
        console.error('[Sport TV] Play error:', err);
        if (progDesc) progDesc.textContent = 'Stream je momentálně nedostupný. Vyzkoušejte jiný kanál.';
      }
    }

    // ── 6. EPG Fetching & Parsing ──
    var epgMap = new Map();

    function normalizeChName(name) {
      if (!name) return '';
      return name.toLowerCase().replace(/[\s\-_.]+/g, '').replace(/hd$/i, '').trim();
    }

    function parseXMLTV(text) {
      if (!text || !text.trim().startsWith('<')) return;
      try {
        var doc = new DOMParser().parseFromString(text, 'text/xml');
        var progs = doc.querySelectorAll('programme');
        progs.forEach(function(p) {
          var ch = p.getAttribute('channel');
          if (!ch) return;
          var titleEl = p.querySelector('title');
          var descEl = p.querySelector('desc');
          var sAttr = p.getAttribute('start');
          var eAttr = p.getAttribute('stop');
          var sDate = window.fT ? window.fT(sAttr) : new Date();
          var eDate = window.fT ? window.fT(eAttr) : new Date();

          var item = {
            title: titleEl ? titleEl.textContent : 'Pořad bez názvu',
            desc: descEl ? descEl.textContent : '',
            start: sDate,
            stop: eDate
          };

          var n = normalizeChName(ch);
          if (!epgMap.has(n)) epgMap.set(n, []);
          epgMap.get(n).push(item);

          // Support MD numbers
          var m = item.title.match(/^MD(\d+)\b/i);
          if (m) {
            var mdKey = normalizeChName('Oneplay Sport MD' + m[1]);
            if (!epgMap.has(mdKey)) epgMap.set(mdKey, []);
            epgMap.get(mdKey).push(item);
          }
        });
        if (currentChannel) updateEpgForChannel(currentChannel.name);
      } catch (e) {
        console.warn('[Sport TV] EPG parse error:', e);
      }
    }

    function fetchEPG() {
      fetch('https://oepg.yasuoyone.org/epg.xml')
        .then(function(r) { return r.text(); })
        .then(parseXMLTV)
        .catch(function() {
          fetch('https://epg.yasuoyone.org/epg.xml')
            .then(function(r) { return r.text(); })
            .then(parseXMLTV)
            .catch(function(){});
        });
    }

    function updateEpgForChannel(chName) {
      if (!chName) return;
      var n = normalizeChName(chName);
      var list = epgMap.get(n) || [];
      var now = new Date();
      var current = list.find(function(p) { return p.start <= now && p.stop > now; });

      if (current) {
        if (progTitle) progTitle.textContent = current.title;
        if (progDesc) progDesc.textContent = current.desc || 'K tomuto pořadu není k dispozici žádný další popis.';
        var pStart = (current.start.getHours() < 10 ? '0' : '') + current.start.getHours() + ':' +
                     (current.start.getMinutes() < 10 ? '0' : '') + current.start.getMinutes();
        var pEnd = (current.stop.getHours() < 10 ? '0' : '') + current.stop.getHours() + ':' +
                   (current.stop.getMinutes() < 10 ? '0' : '') + current.stop.getMinutes();
        if (progTimeStart) progTimeStart.textContent = pStart;
        if (progTimeEnd) progTimeEnd.textContent = pEnd;

        var total = current.stop - current.start;
        var elapsed = now - current.start;
        var pct = Math.min(100, Math.max(0, (elapsed / total) * 100));
        if (progBarFill) progBarFill.style.width = pct + '%';
      } else {
        if (progTitle) progTitle.textContent = chName + ' (Živé vysílání)';
        if (progDesc) progDesc.textContent = 'Sledujte živý přenos stanice ' + chName + '.';
        if (progTimeStart) progTimeStart.textContent = '--:--';
        if (progTimeEnd) progTimeEnd.textContent = '--:--';
        if (progBarFill) progBarFill.style.width = '100%';
      }
    }
    setInterval(function() {
      if (currentChannel) updateEpgForChannel(currentChannel.name);
    }, 30000);

    // ── 7. Render Channels List ──
    function renderChannels(channels) {
      chanListEl.innerHTML = '';
      if (!channels || !channels.length) {
        chanListEl.innerHTML = '<div style="color:var(--text-muted);padding:20px;text-align:center;">Žádné sportovní kanály nenalezeny.</div>';
        return;
      }
      if (chanCountEl) chanCountEl.textContent = channels.length;

      channels.forEach(function(ch, idx) {
        var card = document.createElement('div');
        card.className = 'channel-item' + (idx === 0 ? ' active' : '');
        card.setAttribute('tabindex', '0');
        card.setAttribute('role', 'button');
        card.setAttribute('aria-label', ch.name);

        var logoUrl = ch.icon || 'https://r2.yasuoyone.org/icon.svg';
        card.innerHTML =
          '<img src="' + logoUrl + '" class="chan-logo" alt="' + ch.name + '" loading="lazy" onerror="this.src=\'https://r2.yasuoyone.org/icon.svg\'">' +
          '<div class="chan-info">' +
            '<div class="chan-name">' + ch.name + '</div>' +
            '<div class="chan-sub"><span class="live-dot"></span> Živě</div>' +
          '</div>';

        card.onclick = function() {
          playChannel(ch, card);
        };
        card.onkeydown = function(e) {
          if (e.keyCode === 13 || e.key === 'Enter') {
            e.preventDefault();
            playChannel(ch, card);
          }
        };

        chanListEl.appendChild(card);
        if (idx === 0) {
          activeCardElem = card;
        }
      });

      // Auto-play first channel
      if (channels.length > 0) {
        playChannel(channels[0], chanListEl.firstChild);
      }
    }

    // ── 8. Init Sport TV ──
    function initSportTV() {
      var allCh = window.channels || [];
      sportChannels = allCh.filter(function(c) {
        if (!c || !c.name) return false;
        var s = c.name.toLowerCase();
        if (s.includes('mozaika')) return false;
        var cat = (typeof window.asC === 'function') ? window.asC(c.name) : '';
        return cat === 'Sport' ||
               s.includes('sport') ||
               s.includes('eurosport') ||
               s.includes('arena') ||
               s.includes('premier') ||
               s.includes('canal+') ||
               s.includes('oneplay') ||
               s.includes('f1');
      });

      renderChannels(sportChannels);
      fetchEPG();

      // Focus first channel card for TV remote D-Pad
      setTimeout(function() {
        var first = chanListEl.querySelector('.channel-item');
        if (first && typeof first.focus === 'function') {
          first.focus();
        }
      }, 300);
    }

    // Load scripts dynamically
    function loadScriptAsync(src, cb) {
      var s = document.createElement('script');
      s.src = src;
      s.async = true;
      if (cb) s.onload = cb;
      document.head.appendChild(s);
    }

    var clr = getClearanceToken();
    var q = clr ? ('?cf_clearance=' + encodeURIComponent(clr)) : '';
    loadScriptAsync('https://e.yasuoyone.org/category.js' + q, function() {
      loadScriptAsync('https://e.yasuoyone.org/channels.js' + q, function() {
        initSportTV();
      });
    });

    // ── 9. TV Remote & Keyboard D-Pad Controls ──
    window.addEventListener('keydown', function(e) {
      var isBack = e.key === 'Escape' || e.keyCode === 27 || e.keyCode === 4 ||
                   e.keyCode === 10009 || e.key === 'Back' || e.key === 'XF86Back';

      // Back key ALWAYS navigates back to main Rozcestník menu
      if (isBack) {
        e.preventDefault();
        e.stopPropagation();
        unloadPlayer();
        window.location.href = '../index.html';
        return;
      }

      // Space / MediaPlayPause toggles playback
      if (e.keyCode === 32 || e.keyCode === 179 || e.keyCode === 10252 || e.keyCode === 415 || e.keyCode === 19) {
        e.preventDefault();
        if (typeof TizenAVPlay !== 'undefined' && TizenAVPlay.isAvailable() && TizenAVPlay.getCurrentUrl()) {
          TizenAVPlay.togglePlayPause();
        } else if (videoElem) {
          if (videoElem.paused) videoElem.play().catch(function(){});
          else videoElem.pause();
        }
        return;
      }

      var activeEl = document.activeElement;
      var cards = Array.from(chanListEl.querySelectorAll('.channel-item'));
      var curIdx = cards.indexOf(activeEl);

      // Up arrow in channel list
      if (e.keyCode === 38) {
        if (curIdx > 0) {
          e.preventDefault();
          cards[curIdx - 1].focus();
          cards[curIdx - 1].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
          return;
        } else if (curIdx === 0) {
          e.preventDefault();
          if (btnBack) btnBack.focus();
          return;
        }
      }

      // Down arrow in channel list
      if (e.keyCode === 40) {
        if (activeEl === btnBack && cards.length > 0) {
          e.preventDefault();
          cards[0].focus();
          cards[0].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
          return;
        }
        if (curIdx >= 0 && curIdx < cards.length - 1) {
          e.preventDefault();
          cards[curIdx + 1].focus();
          cards[curIdx + 1].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
          return;
        }
      }

      // Right arrow: move from channels list to Shaka controls / player
      if (e.keyCode === 39) {
        if (curIdx >= 0) {
          e.preventDefault();
          var shakaBtn = shakaContainer ? shakaContainer.querySelector('.shaka-play-pause-btn, .shaka-overflow-menu-button, .shaka-fullscreen-button, button') : null;
          if (shakaBtn) shakaBtn.focus();
          return;
        }
      }

      // Left arrow: return from player back to active channel card
      if (e.keyCode === 37) {
        if (curIdx === -1 && activeCardElem) {
          e.preventDefault();
          activeCardElem.focus();
          activeCardElem.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
          return;
        }
      }
    });

  })();
  </script>
</body>
</html>
